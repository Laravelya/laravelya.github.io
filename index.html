<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERANGA - Absensi Digital</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Laravelya/IQRAWeb/refs/heads/main/assets/ERANGA_LOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --ink: #142a3b;
            --muted: #647586;
            --line: #dce6e8;
            --surface: #ffffff;
            --canvas: #edf5f3;
            --brand: #087f68;
            --brand-dark: #075c50;
            --brand-soft: #e3f3ee;
            --danger: #c84545;
            --warning: #a96d00;
            --shadow: 0 24px 70px rgba(20, 42, 59, 0.13);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', 'Segoe UI', sans-serif;
            color: var(--ink);
            background: linear-gradient(135deg, #e8f3f1 0%, #f6f7f2 52%, #e8eef2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 28px 18px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .32;
            background-image: linear-gradient(rgba(8, 127, 104, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(8, 127, 104, .05) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .container {
            position: relative;
            width: min(100%, 760px);
            min-height: min(720px, calc(100vh - 56px));
            margin: 0 auto;
            padding: clamp(24px, 5vw, 48px);
            border: 1px solid rgba(255, 255, 255, .72);
            border-radius: 24px;
            background: rgba(255, 255, 255, .9);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .login-header { margin-bottom: 34px; }
        .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: #fff;
            background: var(--brand);
            box-shadow: 0 8px 18px rgba(8, 127, 104, .22);
        }
        .app-brand { color: var(--brand-dark); font-size: 20px; font-weight: 800; letter-spacing: .08em; }
        h2, h3, h4 { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; }
        h2 { margin: 0 0 10px; color: var(--ink); font-size: clamp(26px, 4vw, 34px); letter-spacing: -.03em; }
        .login-subtitle { max-width: 430px; margin: 0; color: var(--muted); line-height: 1.6; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--ink); font-size: 13px; font-weight: 700; }
        .input-field-wrapper { position: relative; display: flex; align-items: center; }
        .input-field-wrapper > i { position: absolute; left: 15px; color: #82939b; }
        .input-field-wrapper input, select, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fbfdfc;
            color: var(--ink);
            font: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .input-field-wrapper input { min-height: 50px; padding: 12px 44px; font-size: 15px; }
        .input-field-wrapper input:focus, select:focus, textarea:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px rgba(8, 127, 104, .11); }
        #togglePassword { position: absolute; right: 12px; width: 34px; height: 34px; padding: 0; border: 0; background: transparent; color: #82939b; cursor: pointer; }
        #togglePassword:hover { color: var(--brand-dark); }
        .remember-me { display: flex; align-items: center; gap: 8px; margin: 6px 0 26px; color: var(--muted); font-size: 13px; }
        .remember-me input { width: 16px; height: 16px; accent-color: var(--brand); }
        .btn-login, .dashboard-btn {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            font: 700 14px 'DM Sans', sans-serif;
            letter-spacing: .01em;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, background .2s, opacity .2s;
        }
        .btn-login { color: #fff; background: var(--brand); box-shadow: 0 8px 18px rgba(8, 127, 104, .2); }
        .btn-login:hover, .btn-green:hover { background: var(--brand-dark); transform: translateY(-1px); }
        .btn-login:disabled, .dashboard-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        #loginMsg { min-height: 20px; margin: 12px 0 0; color: var(--danger); text-align: center; font-size: 13px; }
        .footer-text { margin-top: auto; padding-top: 36px; color: #8a9aa1; text-align: center; font-size: 12px; }
        #dashboardSection { text-align: center; }
        #dashboardSection > h3 { margin: 0 0 22px; color: var(--ink) !important; font-size: clamp(22px, 4vw, 30px); letter-spacing: -.03em; }
        #displayUser { color: var(--brand); }
        .user-info { position: relative; margin-bottom: 24px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); text-align: left; box-shadow: 0 10px 24px rgba(20, 42, 59, .06); }
        .profile-heading { display: flex; align-items: center; gap: 12px; padding-bottom: 17px; border-bottom: 1px solid #edf1f1; }
        .profile-icon { width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 40px; border-radius: 11px; color: var(--brand); background: var(--brand-soft); }
        .profile-kicker { display: block; margin-bottom: 3px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
        .profile-name { display: block; color: var(--ink); font: 700 16px 'Plus Jakarta Sans', sans-serif; }
        .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 22px; padding-top: 16px; }
        .profile-item { min-width: 0; padding: 9px 0; }
        .profile-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 600; }
        .profile-value { display: block; overflow-wrap: anywhere; color: var(--ink); font-size: 13px; font-weight: 700; line-height: 1.35; }
        .profile-value em { margin-left: 5px; color: var(--brand); font-size: 10px; font-style: normal; font-weight: 800; letter-spacing: .06em; }
        .today-status { display: flex; align-items: center; justify-content: space-between; gap: 14px; grid-column: 1 / -1; margin-top: 10px; padding: 14px 16px; border: 1px solid #cfe8df; border-radius: 12px; background: var(--brand-soft); }
        .today-status-label { display: flex; align-items: center; gap: 9px; color: var(--brand-dark); font-size: 12px; font-weight: 800; }
        .today-status-label i { font-size: 15px; }
        #textStatusAbsen { color: var(--ink); font-size: 12px; line-height: 1.5; text-align: right; }
        #clock { margin: 0 0 24px; color: var(--ink); font: 800 clamp(28px, 6vw, 42px) 'Plus Jakarta Sans', sans-serif; letter-spacing: .03em; }
        #mainButtons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .dashboard-btn { margin: 0; color: #fff; }
        .btn-green { background: var(--brand); }
        .btn-red { background: var(--danger); }
        .btn-red:hover { background: #a9383d; transform: translateY(-1px); }
        .btn-yellow { color: #5b3a00; background: #f2c14e; }
        .btn-yellow:hover { background: #eab335; transform: translateY(-1px); }
        .btn-gray { color: var(--ink); background: #e7edef; }
        .btn-gray:hover { background: #d6e1e4; transform: translateY(-1px); }
        #mainButtons .btn-gray { grid-column: 1 / -1; }
        .camera-container { position: relative; width: 100%; max-width: 520px; margin: 0 auto 14px; overflow: hidden; border: 1px solid #21343d; border-radius: 16px; background: #10232b; box-shadow: 0 16px 28px rgba(20, 42, 59, .16); }
        #video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transform: scaleX(-1); }
        .face-overlay { position: absolute; top: 50%; left: 50%; width: min(42%, 180px); height: min(62%, 230px); transform: translate(-50%, -50%); border: 2px dashed rgba(255, 255, 255, .82); border-radius: 50%; pointer-events: none; transition: border-color .3s ease; }
        .face-overlay.warning { border-color: #f2c14e; }
        .face-overlay.success { border-color: #4dd5ae; border-style: solid; }
        #canvas { display: none; }
        .hidden { display: none !important; }
        .liveness-badge { margin: 0 auto 14px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: #f5f8f8; color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.4; }
        #cameraArea h4, #izinArea h4 { margin: 0 0 14px; color: var(--ink) !important; font-size: 18px; }
        #cameraArea .btn-gray, #izinArea .btn-gray { margin-top: 10px; }
        #izinArea { max-width: 520px; margin: 0 auto; }
        #izinArea select, #izinArea textarea { padding: 12px 14px; font-size: 14px; }
        #izinArea textarea { min-height: 100px; resize: vertical; }
        #status { min-height: 24px; color: var(--brand-dark); font-size: 13px; }
        .process-spinner { margin-right: 7px; }
        .status-processing { display: inline-flex; align-items: center; gap: 7px; color: var(--brand-dark); }
        #offlineSection { padding: 34px 0 !important; }
        #offlineSection i { color: var(--danger) !important; }
        @media (max-width: 560px) {
            body { padding: 12px; }
            .container { min-height: calc(100vh - 24px); border-radius: 18px; padding: 26px 20px 20px; }
            #mainButtons { grid-template-columns: 1fr; }
            #mainButtons .btn-gray { grid-column: auto; }
            .profile-grid { grid-template-columns: 1fr; gap: 0; }
            .today-status { align-items: flex-start; flex-direction: column; gap: 7px; }
            #textStatusAbsen { text-align: left; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM LOGIN -->
    <div id="loginSection">
        <div class="login-header">
            <div class="brand-row">
                <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-fingerprint"></i></div>
                <div class="app-brand">ERANGA</div>
            </div>
            <h2>Selamat Datang</h2>
            <p class="login-subtitle">Masuk untuk mencatat kehadiran dengan cepat dan aman.</p>
        </div>
        
        <div class="input-group">
            <label for="username">Username</label>
            <div class="input-field-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Masukkan username" autocomplete="username">
            </div>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <div class="input-field-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
                <button type="button" id="togglePassword" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>

        <div class="remember-me">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe" style="margin-bottom:0; cursor:pointer;">Ingat Saya</label>
        </div>

        <button id="btnLogin" class="btn-login" onclick="login()">Login</button>
        <p id="loginMsg" style="color:red;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <h3 style="color: #2c3e50; margin-top:0;">Halo, <span id="displayUser"></span></h3>
        <div id="userInfo" class="user-info"></div>
        <div id="clock">00:00:00 WITA</div>

        <div id="mainButtons">
            <button class="dashboard-btn btn-green" onclick="bukaForm('Masuk')"><i class="fa-solid fa-right-to-bracket"></i> ABSEN MASUK</button>
            <button class="dashboard-btn btn-red hidden" onclick="bukaForm('Keluar')"><i class="fa-solid fa-right-from-bracket"></i> ABSEN KELUAR</button>
            <button class="dashboard-btn btn-yellow" onclick="bukaForm('Izin')"><i class="fa-solid fa-file-pen"></i> IZIN / SAKIT</button>
            <button class="dashboard-btn btn-gray" onclick="logout()" style="margin-top:20px;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
        </div>

        <!-- FORM ABSEN KAMERA (LIVENESS) -->
        <div id="cameraArea" class="hidden">
            <h4 id="menuTitle" style="color:#2c3e50; margin-bottom:10px;"></h4>
            
            <div class="camera-container">
                <video id="video" autoplay playsinline></video>
                <div id="faceOverlay" class="face-overlay"></div>
            </div>
            
            <canvas id="canvas"></canvas>
            <p id="livenessStatus" class="liveness-badge">Kamera aktif. Posisikan wajah Anda...</p>
            
            <button id="btnKirimAbsen" class="dashboard-btn btn-green hidden" onclick="eksekusiAbsen()">KIRIM ABSEN</button>
            <button class="dashboard-btn btn-gray" onclick="batal()">Batal</button>
        </div>

        <!-- FORM IZIN/SAKIT -->
        <div id="izinArea" class="hidden">
            <h4 style="color:#2c3e50;">Form Izin / Sakit</h4>
            <select id="jenisIzin" style="width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; font-size:14px;">
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
            </select>
            <textarea id="keteranganIzin" rows="3" placeholder="Tuliskan alasan izin/sakit..." style="width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; font-size:14px;"></textarea>
            <button id="btnKirimIzin" class="dashboard-btn btn-yellow" onclick="eksekusiIzin()">KIRIM PERMOHONAN</button>
            <button class="dashboard-btn btn-gray" onclick="batal()">Batal</button>
        </div>

        <div id="status" style="margin-top:10px; font-weight:600;"></div>
    </div>

    <!-- TAMPILAN OFFLINE -->
    <div id="offlineSection" class="hidden" style="text-align: center; padding: 20px 0;">
        <i class="fa-solid fa-wifi" style="font-size: 50px; color: #dc3545; margin-bottom: 15px;"></i>
        <h3 style="color: #2c3e50; margin-bottom: 8px;">Koneksi Terputus</h3>
        <p style="color: #6c757d; font-size: 14px; margin-bottom: 20px;">
            Aplikasi memerlukan koneksi internet untuk memproses data absensi.
        </p>
        <button class="btn-login" onclick="location.reload()">
            <i class="fa-solid fa-rotate-right"></i> Coba Lagi
        </button>
    </div>

    <!-- FOOTER -->
    <div class="footer-text">
        &copy; 2026 ERANGA. All rights reserved.
    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
<script defer src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Terpasang!'))
                .catch(err => console.error('SW Gagal:', err));
        });
    }
</script>
</body>
</html>
