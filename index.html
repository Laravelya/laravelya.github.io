<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERANGA - Absensi Digital</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Laravelya/IQRAWeb/refs/heads/main/assets/ERANGA_LOGO.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 420px; 
            background: #ffffff; 
            padding: 35px 25px 25px 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06); 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .app-brand {
            font-size: 30px;
            font-weight: 800;
            color: #43ba92;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        h2 { 
            color: #2c3e50; 
            margin: 0; 
            font-size: 24px; 
        }

        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #34495e; 
            font-size: 14px; 
            font-weight: 500; 
        }
        .input-field-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
        }
        .input-field-wrapper i.fa-user, 
        .input-field-wrapper i.fa-lock { 
            position: absolute; 
            left: 14px; 
            color: #95a5a6; 
        }
        .input-field-wrapper input { 
            width: 100%; 
            padding: 12px 14px 12px 42px; 
            border: 1px solid #dcdde1; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none; 
            transition: border-color 0.2s; 
        }
        .input-field-wrapper input:focus { 
            border-color: #43ba92; 
        }
        
        #togglePassword { 
            position: absolute; 
            right: 14px; 
            background: none; 
            border: none; 
            cursor: pointer; 
            color: #95a5a6; 
            width: auto; 
            padding: 0; 
            margin: 0; 
        }
        #togglePassword:hover { 
            color: #2c3e50; 
        }

        .remember-me { 
            display: flex; 
            align-items: center; 
            margin-bottom: 25px; 
            font-size: 14px; 
            color: #34495e; 
        }
        .remember-me input { 
            margin-right: 8px; 
            width: 16px; 
            height: 16px; 
            accent-color: #43ba92; 
            cursor: pointer; 
        }

        .btn-login { 
            width: 100%; 
            padding: 12px; 
            background-color: #43ba92; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s; 
        }
        .btn-login:hover { 
            background-color: #3aa37f; 
        }
        .btn-login:disabled {
            background-color: #a0d8c6;
            cursor: not-allowed;
        }

        #loginMsg { 
            text-align: center; 
            font-size: 13px; 
            margin-top: 10px; 
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            margin-top: 25px;
        }

        #dashboardSection { text-align: center; }
        
        .user-info { 
            text-align: left; 
            background: #f1f3f5; 
            padding: 16px; 
            border-radius: 12px; 
            font-size: 14px; 
            margin-bottom: 20px; 
            line-height: 1.6; 
            color: #2c3e50;
            border-left: 4px solid #43ba92; 
        }
        .user-info b {
            color: #34495e;
            font-weight: 600;
        }

        #clock { font-size: 24px; font-weight: bold; margin: 10px 0; color: #2c3e50; }
        
        .camera-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 12px;
        }
        #video { 
            width: 100%; 
            display: block;
            transform: scaleX(-1); 
        }
        .face-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 230px;
            border: 2px dashed rgba(220, 53, 69, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transition: border-color 0.3s ease;
        }
        .face-overlay.warning { border-color: rgba(255, 152, 0, 0.9); }
        .face-overlay.success { border-color: rgba(25, 135, 84, 0.9); border-style: solid; }

        #canvas { display: none; }
        .hidden { display: none !important; }
        
        .liveness-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
            background: #e9ecef;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .dashboard-btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; color: #fff; cursor: pointer; transition: opacity 0.2s; }
        .btn-green { background: #198754; }
        .btn-green:hover { background: #157347; }
        .btn-red { background: #dc3545; }
        .btn-red:hover { background: #bb2d3b; }
        .btn-yellow { background: #ffc107; color: #000; }
        .btn-yellow:hover { background: #ffca2c; }
        .btn-gray { background: #6c757d; }
        .btn-gray:hover { background: #5c636a; }

    </style>
</head>
<body>

<div class="container">
    <!-- FORM LOGIN -->
    <div id="loginSection">
        <div class="login-header">
            <div class="app-brand">ERANGA</div>
            <h2>Selamat Datang</h2>
        </div>
        
        <div class="input-group">
            <label for="username">Username</label>
            <div class="input-field-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Masukkan username" autocomplete="username">
            </div>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <div class="input-field-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
                <button type="button" id="togglePassword" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>

        <div class="remember-me">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe" style="margin-bottom:0; cursor:pointer;">Ingat Saya</label>
        </div>

        <button id="btnLogin" class="btn-login" onclick="login()">Login</button>
        <p id="loginMsg" style="color:red;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <h3 style="color: #2c3e50; margin-top:0;">Halo, <span id="displayUser"></span></h3>
        <div id="userInfo" class="user-info"></div>
        <div id="clock">00:00:00 WITA</div>

        <div id="mainButtons">
            <button class="dashboard-btn btn-green" onclick="bukaForm('Masuk')"><i class="fa-solid fa-right-to-bracket"></i> ABSEN MASUK</button>
            <button class="dashboard-btn btn-red hidden" onclick="bukaForm('Keluar')"><i class="fa-solid fa-right-from-bracket"></i> ABSEN KELUAR</button>
            <button class="dashboard-btn btn-yellow" onclick="bukaForm('Izin')"><i class="fa-solid fa-file-pen"></i> IZIN / SAKIT</button>
            <button class="dashboard-btn btn-gray" onclick="logout()" style="margin-top:20px;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
        </div>

        <!-- FORM ABSEN KAMERA (LIVENESS) -->
        <div id="cameraArea" class="hidden">
            <h4 id="menuTitle" style="color:#2c3e50; margin-bottom:10px;"></h4>
            
            <div class="camera-container">
                <video id="video" autoplay playsinline></video>
                <div id="faceOverlay" class="face-overlay"></div>
            </div>
            
            <canvas id="canvas"></canvas>
            <p id="livenessStatus" class="liveness-badge">Kamera aktif. Posisikan wajah Anda...</p>
            
            <button id="btnKirimAbsen" class="dashboard-btn btn-green hidden" onclick="eksekusiAbsen()">KIRIM ABSEN</button>
            <button class="dashboard-btn btn-gray" onclick="batal()">Batal</button>
        </div>

        <!-- FORM IZIN/SAKIT -->
        <div id="izinArea" class="hidden">
            <h4 style="color:#2c3e50;">Form Izin / Sakit</h4>
            <select id="jenisIzin" style="width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; font-size:14px;">
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
            </select>
            <textarea id="keteranganIzin" rows="3" placeholder="Tuliskan alasan izin/sakit..." style="width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; font-size:14px;"></textarea>
            <button id="btnKirimIzin" class="dashboard-btn btn-yellow" onclick="eksekusiIzin()">KIRIM PERMOHONAN</button>
            <button class="dashboard-btn btn-gray" onclick="batal()">Batal</button>
        </div>

        <div id="status" style="margin-top:10px; font-weight:600;"></div>
    </div>

    <!-- TAMPILAN OFFLINE -->
    <div id="offlineSection" class="hidden" style="text-align: center; padding: 20px 0;">
        <i class="fa-solid fa-wifi" style="font-size: 50px; color: #dc3545; margin-bottom: 15px;"></i>
        <h3 style="color: #2c3e50; margin-bottom: 8px;">Koneksi Terputus</h3>
        <p style="color: #6c757d; font-size: 14px; margin-bottom: 20px;">
            Aplikasi memerlukan koneksi internet untuk memproses data absensi.
        </p>
        <button class="btn-login" onclick="location.reload()">
            <i class="fa-solid fa-rotate-right"></i> Coba Lagi
        </button>
    </div>

    <!-- FOOTER -->
    <div class="footer-text">
        &copy; 2026 ERANGA. All rights reserved.
    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
<script defer src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Terpasang!'))
                .catch(err => console.error('SW Gagal:', err));
        });
    }
</script>
</body>
</html>
